<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Memorial às Vítimas do Holocausto — Controle Semanal</title>

  <!-- Meta tags para instalação como Web App (PWA) no Android / iOS -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Visitação Memorial" />
  <meta name="description" content="Controle semanal de visitação (Quinta a Domingo) do Memorial às Vítimas do Holocausto." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            slate: {
              850: '#172033',
              925: '#0b1120',
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.7;
      cursor: pointer;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 24px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .toast-enter {
      animation: slideUp 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-925 text-slate-100 pb-24 selection:bg-amber-500/30 selection:text-amber-200">

  <!-- Cabeçalho Institucional Fixo -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-lg">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between gap-2.5">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-6 h-6 rounded-md bg-[#facc15] border border-amber-300/60 shadow-sm flex items-center justify-center shrink-0 p-1" aria-label="Logo Memorial às Vítimas do Holocausto">
          <svg class="h-3.5 w-auto object-contain" viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="60" height="72" fill="#27272a" />
            <polygon points="60,78 60,120 0,120" fill="#27272a" />
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-bold text-white tracking-tight truncate">
            Memorial às Vítimas do Holocausto
          </h1>
          <div class="flex items-center gap-1.5 text-xs text-slate-400 truncate">
            <span id="headerUserBadge" class="inline-flex items-center gap-1 font-semibold text-amber-300">
              Conectando...
            </span>
            <span>•</span>
            <span id="syncModeIndicator" class="text-[11px] text-slate-400 truncate">Modo Local</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <div class="text-right bg-slate-850/90 border border-slate-700/80 rounded-xl px-2.5 py-1.5 shadow-inner">
          <div id="liveClockTime" class="text-xs sm:text-sm font-extrabold font-mono text-amber-400 tracking-wider leading-tight">
            --:--:--
          </div>
          <div id="liveClockDate" class="text-[10px] sm:text-[11px] text-slate-400 capitalize leading-tight">
            Carregando data...
          </div>
        </div>

        <button id="btnLogout" type="button" title="Sair da conta"
          class="hidden p-2.5 rounded-xl bg-slate-800 hover:bg-rose-500/20 active:scale-95 text-slate-300 hover:text-rose-300 border border-slate-700/80 transition shrink-0">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>

    <div id="mainNavTabs" class="hidden max-w-2xl mx-auto px-4 pb-2.5 flex gap-2">
      <button id="tabCurrent" type="button"
        class="flex-1 py-2 px-2.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-1.5 bg-amber-500 text-slate-950 shadow-sm">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        <span>Semana Atual</span>
      </button>

      <button id="tabHistory" type="button"
        class="flex-1 py-2 px-2.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-1.5 bg-slate-800/80 text-slate-300 hover:bg-slate-800 border border-slate-700/60">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Histórico (<span id="historyCountBadge">1</span>)</span>
      </button>

      <button id="tabTeam" type="button"
        class="hidden flex-1 py-2 px-2.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-1.5 bg-slate-800/80 text-amber-300 hover:bg-slate-800 border border-amber-500/40">
        <svg class="w-4 h-4 shrink-0 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.61

- name: Preparar projeto Capacitor e Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/app @capacitor/filesystem @capacitor-community/file-opener
          npx cap init "Visitação Memorial" "br.org.memorial.visitacao" --web-dir=www
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.server = {
              url: "https://mavericklnp.github.io/memorialchecklist/",
              cleartext: false
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/memorial.keystore

          node -e '
            const fs = require("fs");

            // 1. Adiciona permissão para instalar APKs baixados no AndroidManifest.xml
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let manifest = fs.readFileSync(manifestPath, "utf8");
            if (!manifest.includes("REQUEST_INSTALL_PACKAGES")) {
              manifest = manifest.replace(
                "<uses-permission android:name=\"android.permission.INTERNET\" />",
                "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />"
              );
              fs.writeFileSync(manifestPath, manifest);
            }

            // 2. Configura versionCode, versionName e Keystore Release no build.gradle
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const runNum = process.env.RUN_NUMBER;

            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${runNum}`);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "1.0.${runNum}"`);

            gradle += `

          android {
              signingConfigs {
                  release {
                      storeFile file("memorial.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          `;

            fs.writeFileSync(gradlePath, gradle);
          '
